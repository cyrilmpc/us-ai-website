<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Chat Dashboard - US AI Owner</title>
<style>
body { font-family: Arial, sans-serif; background: #0f0f1a; color: white; margin: 0; }
.header { background: linear-gradient(135deg,#8b5cf6,#d946ef); padding: 16px; }
.container { display: flex; height: calc(100vh - 70px); }
.sidebar { width: 300px; background: #1a1a2e; border-right: 1px solid #333; overflow-y: auto; }
.chat-list-item { padding: 12px; border-bottom: 1px solid #2a2a3e; cursor: pointer; }
.chat-list-item:hover { background: #2a2a3e; }
.chat-list-item.active { background: #8b5cf633; }
.main { flex: 1; display: flex; flex-direction: column; }
.messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.msg-visitor { align-self: flex-start; background: #2a2a3e; padding: 10px 14px; border-radius: 12px; max-width: 70%; }
.msg-owner { align-self: flex-end; background: #8b5cf6; padding: 10px 14px; border-radius: 12px; max-width: 70%; }
.input-area { padding: 12px; border-top: 1px solid #333; display: flex; gap: 8px; }
.input-area input { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #444; background: #2a2a3e; color: white; }
.input-area button { background: #8b5cf6; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; }
</style>
</head>
<body>
<div class="header"><h2>💬 Live Chat Dashboard</h2></div>
<div class="container">
  <div class="sidebar" id="chat-list"><p style="padding:12px;color:#888;">Loading conversations...</p></div>
  <div class="main">
    <div class="messages" id="messages"><p style="color:#888;">Select a conversation</p></div>
    <div class="input-area">
      <input id="reply-input" type="text" placeholder="Type reply...">
      <button onclick="sendReply()">Send</button>
    </div>
  </div>
</div>
<script>
const CHAT_API = 'https://usai-accounts-api.usai-api.workers.dev';
let activeUser = null;

async function loadConversations() {
  try {
    const res = await fetch(`${CHAT_API}/api/chat/conversations`);
    const data = await res.json();
    const list = document.getElementById('chat-list');
    list.innerHTML = '';
    (data.users || []).forEach(u => {
      const div = document.createElement('div');
      div.className = 'chat-list-item' + (u === activeUser ? ' active' : '');
      div.innerHTML = `<b>👤 ${u}</b><br><small style="color:#888">${data.lastMessage?.[u] || ''}</small>`;
      div.onclick = () => { activeUser = u; loadConversations(); loadMessages(); };
      list.appendChild(div);
    });
  } catch(e) { console.error(e); }
}

async function loadMessages() {
  if (!activeUser) return;
  try {
    const res = await fetch(`${CHAT_API}/api/chat/messages?user=${encodeURIComponent(activeUser)}`);
    const data = await res.json();
    const container = document.getElementById('messages');
    container.innerHTML = '';
    (data.messages || []).forEach(m => {
      const div = document.createElement('div');
      div.className = m.from === 'owner' ? 'msg-owner' : 'msg-visitor';
      div.textContent = m.text;
      container.appendChild(div);
    });
    container.scrollTop = container.scrollHeight;
  } catch(e) { console.error(e); }
}

async function sendReply() {
  const input = document.getElementById('reply-input');
  const text = input.value.trim();
  if (!text || !activeUser) return;
  input.value = '';
  await fetch(`${CHAT_API}/api/chat/send`, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({user: activeUser, text: text, from: 'owner'})
  });
  loadMessages();
}

document.getElementById('reply-input').addEventListener('keypress', (e) => {
  if (e.key === 'Enter') sendReply();
});

loadConversations();
setInterval(() => { loadConversations(); if (activeUser) loadMessages(); }, 5000);
</script>
</body>
</html>
