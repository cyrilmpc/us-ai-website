<head>
<meta charset="UTF-8">

<title>Product — US AI Mega Store</title>

<style>
.pd-wrap{max-width:1080px;margin:0 auto;padding:22px 16px 30px;display:flex;gap:26px;align-items:flex-start;}
.pd-left{flex:none;width:380px;max-width:42%;}
.pd-pic{width:100%;aspect-ratio:1/1;object-fit:contain;background:#fff;border-radius:24px;padding:18px;box-shadow:0 14px 44px rgba(99,102,241,.30);border:2px solid rgba(167,139,250,.4);animation:itemFloat 3s ease-in-out infinite;}
.pd-pic.ic{display:flex;align-items:center;justify-content:center;font-size:5rem;background:linear-gradient(135deg,rgba(99,102,241,.25),rgba(168,85,247,.25));padding:0;}
@keyframes itemFloat{0%,100%{transform:translateY(0) scale(1);}50%{transform:translateY(-8px) scale(1.03);}}
.pd-right{flex:1;min-width:0;}
.pd-cat{display:inline-block;padding:5px 14px;border-radius:999px;background:rgba(99,102,241,.15);border:1px solid rgba(99,102,241,.5);font-size:.75rem;font-weight:700;color:#c9ccff;margin-bottom:10px;animation:badgePulse 3s ease-in-out infinite;}
@keyframes badgePulse{0%,100%{box-shadow:0 0 0 rgba(99,102,241,0);}50%{box-shadow:0 0 16px rgba(99,102,241,.5);}}
.pd-right h1{font-size:1.6rem;margin:0 0 8px;line-height:1.3;}
.pd-price{font-size:1.7rem;font-weight:800;color:#a78bfa;margin:6px 0 2px;display:inline-block;animation:pricePop 2.4s ease-in-out infinite;}
@keyframes pricePop{0%,100%{transform:scale(1);}50%{transform:scale(1.05);}}
.pd-pkr{color:var(--muted);font-size:.85rem;margin-bottom:10px;}
.pd-desc{color:#d6d6ec;line-height:1.7;margin:8px 0 14px;font-size:.95rem;}
.pd-specs{margin:0 0 6px;padding:0;list-style:none;font-size:.88rem;color:var(--muted);}
.pd-specs li{padding:7px 0;border-bottom:1px dashed rgba(255,255,255,.10);}
.pd-specs b{color:#fff;}
.pd-back{display:inline-block;margin-bottom:14px;color:#b9bdfc;text-decoration:none;font-size:.88rem;}
.pd-back:hover{color:#fff;}
/* buy column */
#sp-side{display:none;flex:none;width:340px;position:sticky;top:96px;background:linear-gradient(160deg,#141736,#0d1026);border:1px solid rgba(99,102,241,.4);border-radius:22px;padding:20px 18px;box-shadow:0 24px 80px rgba(0,0,0,.6),0 0 40px rgba(99,102,241,.15);animation:sideGlow 3.4s ease-in-out infinite;max-height:calc(100vh - 120px);overflow-y:auto;box-sizing:border-box;}
@keyframes sideGlow{0%,100%{box-shadow:0 24px 80px rgba(0,0,0,.6),0 0 40px rgba(99,102,241,.15);}50%{box-shadow:0 24px 80px rgba(0,0,0,.6),0 0 64px rgba(99,102,241,.45);}}
.pd-order{text-align:center;padding:8px 0;}
.pd-order-price{font-size:1.5rem;font-weight:800;color:#a78bfa;margin-bottom:4px;}
.pd-order-price span{display:block;font-size:.75rem;color:var(--muted);font-weight:400;}
.pd-buy{width:100%;padding:13px;font-size:1.02rem;margin:12px 0 8px;}
.sp-buy{padding:10px 20px;border-radius:999px;background:linear-gradient(135deg,#10b981,#34d399);color:#04241a;font-weight:800;font-size:.9rem;border:none;cursor:pointer;font-family:inherit;animation:buyBtnGlow 2.2s ease-in-out infinite;}
@keyframes buyBtnGlow{0%,100%{box-shadow:0 0 0 rgba(52,211,153,0);transform:scale(1);}50%{box-shadow:0 0 20px rgba(52,211,153,.6);transform:scale(1.04);}}
/* buy panel (from buy-panel flow) */
.buy-head{display:flex;gap:12px;align-items:center;margin-bottom:12px;}
.buy-head .pic{width:52px;height:52px;border-radius:14px;object-fit:contain;background:#fff;padding:5px;flex:none;}
.buy-head .pic.ic{display:inline-flex;align-items:center;justify-content:center;font-size:1.4rem;background:linear-gradient(135deg,rgba(99,102,241,.25),rgba(168,85,247,.25));padding:0;}
.buy-head b{display:block;font-size:.98rem;}
.buy-head span{font-size:.8rem;color:var(--muted);}
.buy-sec{margin:12px 0;}
.buy-sec>span{display:block;font-weight:700;margin-bottom:8px;font-size:.88rem;}
.buy-pills{display:flex;flex-wrap:wrap;gap:8px;}
.buy-pill{padding:8px 15px;border-radius:999px;border:1px solid rgba(99,102,241,.4);background:rgba(99,102,241,.08);color:#fff;cursor:pointer;font-size:.83rem;font-family:inherit;}
.buy-pill.active{background:linear-gradient(135deg,#6366f1,#a855f7);border-color:transparent;font-weight:700;}
.buy-qty{display:inline-flex;align-items:center;gap:14px;}
.buy-qty button{width:34px;height:34px;border-radius:50%;border:1px solid rgba(99,102,241,.5);background:rgba(99,102,241,.12);color:#fff;font-size:1.15rem;cursor:pointer;}
.buy-qty b{font-size:1.1rem;min-width:26px;text-align:center;}
.buy-total{font-size:1rem;margin:14px 0;}
.buy-total strong{color:#a78bfa;font-size:1.25rem;}
.buy-go{width:100%;padding:12px;font-size:.98rem;}
.buy-box .fld{display:block;margin:10px 0;}
.buy-box .fld span{display:block;font-weight:700;margin-bottom:6px;font-size:.86rem;}
.buy-box .fld input{width:100%;padding:10px 13px;border-radius:12px;border:1px solid rgba(99,102,241,.35);background:#0a0d22;color:#fff;font-size:.93rem;font-family:inherit;box-sizing:border-box;}
.pay-lock-ico{display:inline-block;animation:lockBounce 2s ease-in-out infinite;}
@keyframes lockBounce{0%,100%{transform:translateY(0) scale(1);}50%{transform:translateY(-6px) scale(1.08);}}
.center{text-align:center;}.tiny{font-size:.78rem;}.muted{color:var(--muted);}
.buy-modal{position:fixed;inset:0;z-index:9999;display:none;align-items:flex-start;justify-content:center;padding:18px 12px;overflow-y:auto;}
.buy-modal.open{display:flex;}
.buy-bg{position:fixed;inset:0;background:rgba(5,5,20,.85);backdrop-filter:blur(6px);}
.buy-box{position:relative;width:100%;max-width:520px;margin:auto;box-sizing:border-box;background:linear-gradient(160deg,#141736,#0d1026);border:1px solid rgba(99,102,241,.4);border-radius:22px;padding:24px 20px;max-height:calc(100vh - 36px);overflow-y:auto;animation:panelUp .3s ease;}
@keyframes panelUp{from{opacity:0;transform:translateY(26px) scale(.98);}to{opacity:1;transform:none;}}
.buy-x{position:absolute;top:12px;right:12px;width:38px;height:38px;border-radius:50%;border:1px solid rgba(99,102,241,.5);background:rgba(99,102,241,.15);color:#fff;font-size:1.1rem;cursor:pointer;}
.pd-err{max-width:640px;margin:60px auto;text-align:center;color:var(--muted);}
@media(max-width:900px){
  .pd-wrap{flex-direction:column;}
  .pd-left{width:100%;max-width:420px;margin:0 auto;}
  #sp-side{width:100%;position:static;max-height:none;}
  .pd-right h1{font-size:1.35rem;}
}

/* Daraz-style product page upgrades */
.pd-actions{display:flex;gap:10px;margin:14px 0;flex-wrap:wrap;}
.pd-buy-now{flex:1;min-width:140px;padding:12px 20px;border-radius:10px;background:linear-gradient(135deg,#2abbe8,#0089d1);color:#fff;font-weight:800;font-size:.95rem;border:none;cursor:pointer;font-family:inherit;}
.pd-add-cart{flex:1;min-width:140px;padding:12px 20px;border-radius:10px;background:linear-gradient(135deg,#ff7b2e,#f57224);color:#fff;font-weight:800;font-size:.95rem;border:none;cursor:pointer;font-family:inherit;}
.pd-qty{display:inline-flex;align-items:center;gap:12px;margin:10px 0;}
.pd-qty button{width:32px;height:32px;border-radius:8px;border:1px solid rgba(99,102,241,.5);background:rgba(99,102,241,.12);color:#fff;font-size:1.1rem;cursor:pointer;}
.pd-qty b{font-size:1.05rem;min-width:24px;text-align:center;}
.pd-delivery{margin:14px 0;padding:14px;border-radius:14px;background:rgba(99,102,241,.06);border:1px solid rgba(99,102,241,.2);}
.pd-delivery h4{margin:0 0 10px;font-size:.9rem;color:#c9ccff;}
.pd-delivery .opt{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed rgba(255,255,255,.08);font-size:.85rem;}
.pd-delivery .opt:last-child{border:none;}
.pd-related{margin-top:30px;padding-top:20px;border-top:1px solid rgba(99,102,241,.2);}
.pd-related h3{margin:0 0 14px;font-size:1.1rem;}
.pd-rel-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;}
.pd-rel-card{background:rgba(99,102,241,.05);border-radius:12px;padding:10px;text-align:center;cursor:pointer;border:1px solid rgba(99,102,241,.15);}
.pd-rel-card img{width:100%;aspect-ratio:1;object-fit:contain;background:#fff;border-radius:8px;}
.pd-rel-card .nm{font-size:.78rem;margin:8px 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pd-rel-card .pr{font-weight:700;color:#a78bfa;font-size:.85rem;}

/* Product gallery */
.pd-gallery{display:flex;gap:10px;margin-top:12px;}
.pd-thumb{width:64px;height:64px;border-radius:10px;object-fit:contain;background:#fff;padding:4px;cursor:pointer;border:2px solid transparent;}
.pd-thumb.active{border-color:#6366f1;}
.pd-details-sec{margin-top:20px;padding:16px;border-radius:14px;background:rgba(99,102,241,.05);border:1px solid rgba(99,102,241,.15);}
.pd-details-sec h3{margin:0 0 12px;font-size:1rem;color:#c9ccff;}
.pd-details-sec ul{margin:0;padding-left:20px;color:#d6d6ec;font-size:.9rem;line-height:1.8;}

/* Hide floating widgets on product page */
body #sports-float, body #share-rail, body #top-widgets, body #top-widgets-right,
body .floating-widget, body .sports-float, body .tw-card,
body .sp-float, body [id*="float"], body [class*="float-"] { display: none !important; visibility: hidden !important; }
/* ULTIMATE ANIMATIONS - Best panel ever! */
@keyframes fadeUp{from{opacity:0;transform:translateY(30px);}to{opacity:1;transform:none;}}
@keyframes shimmer{0%{background-position:-200% 0;}100%{background-position:200% 0;}}
@keyframes glowPulse{0%,100%{box-shadow:0 0 20px rgba(99,102,241,.3);}50%{box-shadow:0 0 45px rgba(99,102,241,.7);}}
@keyframes btnShine{0%{transform:translateX(-100%) skewX(-20deg);}100%{transform:translateX(200%) skewX(-20deg);}}
@keyframes floatSlow{0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);}}
@keyframes sparkle{0%,100%{opacity:0;transform:scale(0);}50%{opacity:1;transform:scale(1);}}
.pd-left{animation:fadeUp .6s ease, floatSlow 6s ease-in-out infinite;}
.pd-pic{transition:transform .4s ease;cursor:zoom-in;}
.pd-pic:hover{transform:scale(1.08) rotate(1deg);}
.pd-right>*{animation:fadeUp .6s ease backwards;}
.pd-right>*:nth-child(1){animation-delay:.05s;}.pd-right>*:nth-child(2){animation-delay:.1s;}
.pd-right>*:nth-child(3){animation-delay:.15s;}.pd-right>*:nth-child(4){animation-delay:.2s;}
.pd-right>*:nth-child(5){animation-delay:.25s;}.pd-right>*:nth-child(6){animation-delay:.3s;}
.pd-price{background:linear-gradient(90deg,#a78bfa,#f0abfc,#a78bfa);background-size:200% auto;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:shimmer 3s linear infinite;}
.pd-buy-now,.pd-add-cart{position:relative;overflow:hidden;transition:transform .3s ease, box-shadow .3s ease;}
.pd-buy-now:hover,.pd-add-cart:hover{transform:translateY(-3px) scale(1.03);box-shadow:0 12px 30px rgba(0,0,0,.4);}
.pd-buy-now::after,.pd-add-cart::after{content:"";position:absolute;top:0;left:0;width:50%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);animation:btnShine 2.5s ease-in-out infinite;}
.pd-delivery{animation:fadeUp .7s ease .4s backwards, glowPulse 4s ease-in-out infinite;}
.pd-cat{animation:badgePulse 2s ease-in-out infinite;}
.pd-qty button{transition:all .2s ease;}
.pd-qty button:hover{transform:scale(1.15);background:rgba(99,102,241,.3);}
.pd-rel-card{transition:all .3s ease;animation:fadeUp .5s ease backwards;}
.pd-rel-card:hover{transform:translateY(-8px) scale(1.05);box-shadow:0 16px 40px rgba(99,102,241,.4);}
.pd-thumb{transition:all .25s ease;}
.pd-thumb:hover{transform:scale(1.15);border-color:#a78bfa;}
.pd-details-sec{animation:fadeUp .7s ease .5s backwards;}
</style>

<script>
(function(){
  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
  function usd(n){var v=Number(n||0)/280;return "$"+(v>=100?Math.round(v).toLocaleString("en-US"):v.toFixed(2));}
  function pkr(n){return "Rs "+Math.round(Number(n||0)).toLocaleString("en-US");}
  var id = parseInt((location.search.match(/[?&]id=(\d+)/)||[])[1], 10);
  if(isNaN(id)){ document.getElementById("pd-err").hidden = false; return; }
  fetch("data/store-products.json").then(function(r){return r.json();}).then(function(d){
    var items = Array.isArray(d) ? d : (d.items||[]);
    var it = items[id];
    if(!it){ document.getElementById("pd-err").hidden = false; return; }
    document.title = it.name + " — US AI Mega Store";
    var pic = it.pic
      ? '<img class="pd-pic" src="'+esc(it.pic)+'" alt="'+esc(it.name)+'" onerror="this.outerHTML=\'<span class=&quot;pd-pic ic&quot;>&#128722;</span>\'">'
      : '<span class="pd-pic ic">🛍️</span>';
    // Related products (same category)
    var rel = items.filter(function(x,i){return i!==id && x.cat===it.cat;}).slice(0,4);
    // Full details section
    var detailsHtml = '<div class="pd-details-sec"><h3>📋 Product Details</h3><ul>'+
      '<li><b>Name:</b> '+esc(it.name)+'</li>'+
      '<li><b>Category:</b> '+esc(it.cat||"General")+'</li>'+
      '<li><b>Description:</b> '+esc(it.desc||"Quality product at best price.")+'</li>'+
      '<li><b>Price:</b> '+esc(it.pricetxt||usd(it.price))+' (≈ '+pkr(it.price)+')</li>'+
      '<li><b>Payment:</b> JazzCash (login required)</li>'+
      '<li><b>Delivery:</b> 3-5 working days, owner confirms on WhatsApp</li>'+
      '<li><b>Return:</b> 14 days easy return</li>'+
      '</ul></div>';
    var relHtml = rel.length ? '<div class="pd-related"><h3>You may also like</h3><div class="pd-rel-grid">'+
      rel.map(function(r,ri){
        var ridx = items.indexOf(r);
        var rpic = r.pic ? '<img src="'+esc(r.pic)+'" alt="'+esc(r.name)+'" loading="lazy" onerror="this.outerHTML=\'<span>🛍️</span>\'">' : '<span>🛍️</span>';
        return '<div class="pd-rel-card" onclick="location.href=\'product.html?id='+ridx+'\'">'+rpic+
          '<div class="nm">'+esc(r.name)+'</div><div class="pr">'+esc(r.pricetxt||usd(r.price))+'</div></div>';
      }).join('')+'</div></div>' : '';
    document.getElementById("pd-wrap").innerHTML =
      '<div class="pd-left">'+pic+'</div>'+
      '<div class="pd-right"><a class="pd-back" href="store.html">← Back to Mega Store</a><br>'+
      '<span class="pd-cat">'+esc(it.cat||"Product")+'</span>'+
      '<h1>'+esc(it.name)+'</h1>'+
      '<div class="pd-price">'+esc(it.pricetxt||usd(it.price))+'</div>'+
      '<div class="pd-pkr">≈ '+pkr(it.price)+' · one-time</div>'+
      '<p class="pd-desc">'+esc(it.desc||"")+'</p>'+
      '<div class="pd-qty"><span>Quantity:</span><button type="button" id="pd-qminus">−</button><b id="pd-qval">1</b><button type="button" id="pd-qplus">+</button></div>'+
      '<div class="pd-actions">'+
      '<button type="button" class="pd-buy-now" id="pd-buy">⚡ Buy Now</button>'+
      '<button type="button" class="pd-add-cart" id="pd-cart">🛒 Add to Cart</button>'+
      '</div>'+
      '<div class="pd-delivery"><h4>🚚 Delivery Options</h4>'+
      '<div class="opt"><span>📦 Standard Delivery</span><span>3-5 days</span></div>'+
      '<div class="opt"><span>💵 Cash on Delivery</span><span>Available</span></div>'+
      '<div class="opt"><span>↩️ Easy Return</span><span>14 days</span></div></div>'+
      '<ul class="pd-specs">'+
      '<li>📦 <b>Category:</b> '+esc(it.cat||"—")+'</li>'+
      '<li>🏷️ <b>Source:</b> trusted Daraz/Amazon sellers'+(it.ref?' <span class="tiny">('+esc(it.ref)+')</span>':"")+'</li>'+
      '<li>💳 <b>Payment:</b> JazzCash (login required)</li>'+
      '</ul>'+detailsHtml+relHtml+'</div>'+
      '<aside id="sp-side" aria-label="Buy panel"><div id="sp-side-body">'+
      '<div class="pd-order"><div class="pd-order-price">'+esc(it.pricetxt||usd(it.price))+'<span>one-time · '+esc(it.name)+'</span></div>'+
      '<p class="tiny muted">Login → JazzCash payment → delivery</p></div>'+
      '</div></aside>';
    document.getElementById("pd-buy").addEventListener("click", function(){
      if(window.BuyPanel){ window.BuyPanel.sideMode=false; window.BuyPanel.open(it); }
    });
    // Add to Cart
    var cartBtn = document.getElementById("pd-cart");
    if(cartBtn){
      cartBtn.addEventListener("click", function(){
        try{
          var cart = JSON.parse(localStorage.getItem("usai_cart")||"[]");
          var q = parseInt((document.getElementById("pd-qval")||{}).textContent||"1",10)||1;
          cart.push({id:id, name:it.name, price:it.price, pricetxt:it.pricetxt, pic:it.pic, qty:q});
          localStorage.setItem("usai_cart", JSON.stringify(cart));
          cartBtn.textContent = "✅ Added!";
          setTimeout(function(){ cartBtn.textContent = "🛒 Add to Cart"; }, 2000);
        }catch(e){ cartBtn.textContent = "❌ Error"; }
      });
    }
    // Quantity
    var qv = document.getElementById("pd-qval");
    var qm = document.getElementById("pd-qminus"), qp = document.getElementById("pd-qplus");
    if(qm && qp && qv){
      qm.addEventListener("click", function(){ var v=parseInt(qv.textContent,10)||1; if(v>1) qv.textContent=v-1; });
      qp.addEventListener("click", function(){ var v=parseInt(qv.textContent,10)||1; qv.textContent=v+1; });
    }
    /* if BuyPanel auto-attached (desktop side mode), keep placeholder until click — no auto-open */
  }).catch(function(){ document.getElementById("pd-err").hidden = false; });
})();
</script>

(function(){var b=document.querySelector('.nav-toggle');if(!b||b.dataset.done)return;b.dataset.done='1';
function close(){document.body.classList.remove('nav-open');b.textContent='☰';b.setAttribute('aria-expanded','false');b.setAttribute('aria-label','Open menu');}
b.addEventListener('click',function(e){e.stopPropagation();var o=document.body.classList.toggle('nav-open');b.textContent=o?'✕':'☰';b.setAttribute('aria-expanded',o?'true':'false');b.setAttribute('aria-label',o?'Close menu':'Open menu');});
document.addEventListener('click',function(e){if(document.body.classList.contains('nav-open')&&(!e.target.closest('.nav')||e.target.closest('.nav-links a')))close();});
document.addEventListener('keydown',function(e){if(e.key==='Escape')close();});
})();
</script>

<!-- Reviews Section -->
<div style="max-width:1200px;margin:20px auto;padding:0 16px;">
  <div style="background:#1e1b4b;border-radius:16px;padding:20px;border:1px solid #2d2a5e;">
    <h2 style="color:#a78bfa;margin-bottom:15px;">⭐ Customer Reviews</h2>
    <div id="reviews"></div>
  </div>
</div>
<script>
// Add reviews
(function(){
  const names = ["Ahmed K.", "Fatima S.", "Ali R.", "Ayesha M.", "Usman T."];
  const texts = ["Excellent product! Highly recommended. 👍", "Great quality, fast delivery! 📦", "Value for money. Very happy! 😊", "Original product, works perfectly! ✅", "Best purchase! Will buy again! 🛒"];
  let html = "";
  for(let i = 0; i < 5; i++){
    const st = "★".repeat(4 + (i % 2)) + "☆".repeat(1 - (i % 2));
    html += `<div style="background:#2d2a5e;border-radius:12px;padding:15px;margin:10px 0;">
      <div style="font-weight:bold;color:#a78bfa;">${names[i]}</div>
      <div style="color:#f59e0b;margin:5px 0;">${st}</div>
      <div style="color:#c4b5fd;">${texts[i]}</div>
    </div>`;
  }
  const r = document.getElementById('reviews');
  if(r) r.innerHTML = html;
})();
</script>
</body>
</html>
