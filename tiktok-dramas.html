<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TikTok - Turkish Drama Shorts — US AI</title>
<meta name="description" content="Watch viral Turkish drama shorts TikTok style - Ertugrul, Osman, and more with Urdu subtitles.">
<link rel="icon" type="image/png" href="favicon.png">
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { background:#000; color:#fff; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; overflow:hidden; height:100vh; height:100dvh; }

/* TikTok header */
.tk-header {
  position:fixed; top:0; left:0; right:0; z-index:100;
  display:flex; align-items:center; justify-content:center;
  padding:12px; gap:20px;
  background:linear-gradient(to bottom, rgba(0,0,0,.6), transparent);
}
.tk-logo { font-size:1.4rem; font-weight:800; letter-spacing:-0.5px; }
.tk-logo span:first-child { color:#fff; }
.tk-tab { font-size:1rem; color:#aaa; cursor:pointer; padding:4px 8px; }
.tk-tab.active { color:#fff; font-weight:700; border-bottom:2px solid #fff; }

/* Video feed */
.tk-feed {
  height:100vh; height:100dvh;
  overflow-y:scroll; scroll-snap-type:y mandatory;
  scrollbar-width:none;
}
.tk-feed::-webkit-scrollbar { display:none; }

.tk-video-wrap {
  height:100vh; height:100dvh; width:100vw;
  scroll-snap-align:start; scroll-snap-stop:always;
  position:relative; background:#000; overflow:hidden;
}
.tk-video {
  width:100vw; height:100vh; height:100dvh; object-fit:cover;
  position:absolute; top:0; left:0;
}

/* Auto-scroll animation indicator */
.tk-autoscroll {
  position:fixed; top:60px; left:50%; transform:translateX(-50%);
  z-index:99; background:rgba(0,0,0,.6); padding:6px 16px; border-radius:20px;
  font-size:0.8rem; color:#fff; display:flex; align-items:center; gap:8px;
  animation:floatUp 2s ease-in-out infinite;
}
@keyframes floatUp { 0%,100%{transform:translate(-50%,0)} 50%{transform:translate(-50%,-8px)} }

/* Right action bar (like TikTok) */
.tk-actions {
  position:absolute; right:8px; bottom:100px; z-index:10;
  display:flex; flex-direction:column; align-items:center; gap:20px;
}
.tk-action { display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer; }
.tk-action-btn {
  width:48px; height:48px; border-radius:50%;
  background:rgba(255,255,255,.15); backdrop-filter:blur(10px);
  display:flex; align-items:center; justify-content:center; font-size:1.4rem;
  transition:transform .2s;
}
.tk-action-btn:active { transform:scale(0.9); }
.tk-action-count { font-size:0.75rem; font-weight:600; }
.tk-action.liked .tk-action-btn { background:#fe2c55; }
.tk-avatar {
  width:48px; height:48px; border-radius:50%; border:2px solid #fff;
  background:linear-gradient(135deg,#667eea,#764ba2);
  display:flex; align-items:center; justify-content:center; font-size:1.2rem;
}

/* Bottom info */
.tk-info {
  position:absolute; left:12px; right:70px; bottom:20px; z-index:10;
}
.tk-username { font-weight:700; font-size:1rem; margin-bottom:8px; }
.tk-desc { font-size:0.9rem; line-height:1.4; margin-bottom:8px; opacity:.9; }
.tk-music {
  display:flex; align-items:center; gap:8px; font-size:0.85rem;
  background:rgba(0,0,0,.4); padding:6px 12px; border-radius:20px;
  width:fit-content; max-width:100%;
}
.tk-music-scroll { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.tk-disc {
  width:40px; height:40px; border-radius:50%;
  background:conic-gradient(#333,#666,#333);
  animation:spin 4s linear infinite; flex-shrink:0;
}
@keyframes spin { to{transform:rotate(360deg)} }

/* Play/pause indicator */
.tk-play-ind {
  position:absolute; inset:0; z-index:5;
  display:flex; align-items:center; justify-content:center;
  font-size:4rem; opacity:0; pointer-events:none; transition:opacity .3s;
}
.tk-play-ind.show { opacity:.8; }

/* Progress bar */
.tk-progress {
  position:absolute; bottom:0; left:0; right:0; height:3px; z-index:11;
  background:rgba(255,255,255,.2);
}
.tk-progress-fill { height:100%; background:#fe2c55; width:0%; }

/* Close button */
.tk-close {
  position:fixed; top:12px; left:12px; z-index:101;
  width:36px; height:36px; border-radius:50%;
  background:rgba(0,0,0,.5); border:none; color:#fff; font-size:1.2rem; cursor:pointer;
}
</style>
</head>
<body>

<button class="tk-close" onclick="history.back()">✕</button>

<div class="tk-header">
  <div class="tk-tab">Following</div>
  <div class="tk-logo"><span>Tik</span><span style="color:#fe2c55">Tok</span></div>
  <div class="tk-tab active">For You</div>
</div>

<div class="tk-autoscroll" id="autoscroll-ind">
  ⬆ Auto-playing • Tap to interact
</div>

<div class="tk-feed" id="feed">
  <!-- Videos injected by JS -->
</div>

<script>
// Drama shorts data
const VIDEOS = [
  {src:"trailers/ertugrul-ghazi/shorts/ertugrul-ghazi-short1.mp4", drama:"Ertugrul Ghazi", desc:"🔥 Epic battle scene! Ertugrul's courage knows no bounds! #Ertugrul #TurkishDrama"},
  {src:"trailers/ertugrul-ghazi/shorts/ertugrul-ghazi-short2.mp4", drama:"Ertugrul Ghazi", desc:"⚔️ The Kayi tribe faces its greatest challenge! #DramaShorts"},
  {src:"trailers/ertugrul-ghazi/shorts/ertugrul-ghazi-short3.mp4", drama:"Ertugrul Ghazi", desc:"💪 When honor is at stake, warriors rise! #ErtugrulGhazi"},
  {src:"trailers/osman-ghazi/shorts/osman-ghazi-short1.mp4", drama:"Osman Ghazi", desc:"🏹 Osman Bey's legendary strategy! #KurulusOsman #Shorts"},
  {src:"trailers/osman-ghazi/shorts/osman-ghazi-short2.mp4", drama:"Osman Ghazi", desc:"⚡ The foundation of an empire begins! #OsmanBey"},
  {src:"trailers/osman-ghazi/shorts/osman-ghazi-short3.mp4", drama:"Osman Ghazi", desc:"🗡️ Brave warriors of the Ottoman Empire! #TurkishSeries"},
  {src:"trailers/orhan-ghazi/shorts/orhan-ghazi-short1.mp4", drama:"Orhan Ghazi", desc:"👑 The son of Osman continues the legacy! #OrhanGhazi"},
  {src:"trailers/orhan-ghazi/shorts/orhan-ghazi-short2.mp4", drama:"Orhan Ghazi", desc:"🔥 New conquests, new victories! #Drama"},
  {src:"trailers/alparslan-buyuk-selcuklu/shorts/alparslan-buyuk-selcuklu-short1.mp4", drama:"Alparslan", desc:"🏇 Sultan Alparslan's heroic journey! #Alparslan #Selcuklu"},
  {src:"trailers/alparslan-buyuk-selcuklu/shorts/alparslan-buyuk-selcuklu-short2.mp4", drama:"Alparslan", desc:"⚔️ The great Seljuk warrior! #HistoricalDrama"},
  {src:"trailers/barbaroslar-akdenizin-kilici/shorts/barbaroslar-akdenizin-kilici-short1.mp4", drama:"Barbaroslar", desc:"🌊 The sword of the Mediterranean! #Barbaros #SeaWarrior"},
  {src:"trailers/barbaroslar-akdenizin-kilici/shorts/barbaroslar-akdenizin-kilici-short2.mp4", drama:"Barbaroslar", desc:"⛵ Epic naval battles! #TurkishDrama #Shorts"},
  {src:"trailers/destan/shorts/destan-short1.mp4", drama:"Destan", desc:"🦅 The epic legend begins! #Destan #FantasyDrama"},
  {src:"trailers/destan/shorts/destan-short2.mp4", drama:"Destan", desc:"✨ Mystical powers awaken! #EpicSeries"},
  {src:"trailers/destan/shorts/destan-short3.mp4", drama:"Destan", desc:"🔥 Destiny calls the brave! #DramaShorts"},
  {src:"trailers/mehmed-fetihler-sultani/shorts/mehmed-fetihler-sultani-short1.mp4", drama:"Mehmed", desc:"🏰 The conqueror of Constantinople! #Mehmed #History"},
  {src:"trailers/mehmed-fetihler-sultani/shorts/mehmed-fetihler-sultani-short2.mp4", drama:"Mehmed", desc:"👑 Sultan Mehmed's grand vision! #OttomanEmpire"},
  {src:"trailers/mehmed-fetihler-sultani/shorts/mehmed-fetihler-sultani-short3.mp4", drama:"Mehmed", desc:"⚔️ The fate of empires! #HistoricalDrama"},
  {src:"trailers/selahaddin-eyyubi/shorts/selahaddin-eyyubi-short1.mp4", drama:"Selahaddin", desc:"🕌 The liberator of Jerusalem! #Selahaddin #Hero"},
  {src:"trailers/selahaddin-eyyubi/shorts/selahaddin-eyyubi-short2.mp4", drama:"Selahaddin", desc:"⚡ Justice prevails! #EpicDrama"},
  {src:"trailers/payitaht-abdulhamid/shorts/payitaht-abdulhamid-short1.mp4", drama:"Abdulhamid", desc:"👑 The last great Sultan! #Payitaht #History"},
  {src:"trailers/payitaht-abdulhamid/shorts/payitaht-abdulhamid-short2.mp4", drama:"Abdulhamid", desc:"🏛️ Palace intrigues! #TurkishSeries"},
  {src:"trailers/uyanis-buyuk-selcuklu/shorts/uyanis-buyuk-selcuklu-short1.mp4", drama:"Uyanis", desc:"🌅 The awakening of an empire! #Selcuklu #Drama"},
  {src:"trailers/uyanis-buyuk-selcuklu/shorts/uyanis-buyuk-selcuklu-short2.mp4", drama:"Uyanis", desc:"🔥 Rise of the Seljuks! #HistoricalShorts"},
];

const feed = document.getElementById('feed');
let autoScroll = true;
let currentIdx = 0;

// Build video elements
VIDEOS.forEach((v, i) => {
  const wrap = document.createElement('div');
  wrap.className = 'tk-video-wrap';
  wrap.innerHTML = `
    <video class="tk-video" src="${v.src}" loop playsinline preload="metadata"></video>
    <div class="tk-play-ind">▶</div>
    <div class="tk-actions">
      <div class="tk-action" onclick="toggleFollow(this)">
        <div class="tk-avatar">🎬</div>
        <div style="background:#fe2c55;border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-size:0.8rem;margin-top:-10px;position:relative;z-index:2;">+</div>
        <div class="tk-action-count follow-text">Follow</div>
      </div>
      <div class="tk-action" onclick="toggleLike(this)">
        <div class="tk-action-btn">❤️</div>
        <div class="tk-action-count">${(Math.random()*900+100|0)}K</div>
      </div>
      <div class="tk-action" onclick="openComments(this)">
        <div class="tk-action-btn">💬</div>
        <div class="tk-action-count">${(Math.random()*90+10|0)}K</div>
      </div>
      <div class="tk-action">
        <div class="tk-action-btn">↗️</div>
        <div class="tk-action-count">Share</div>
      </div>
    </div>
    <div class="tk-info">
      <div class="tk-username">@usai_dramas • ${v.drama}</div>
      <div class="tk-desc">${v.desc}</div>
      <div class="tk-music">
        <div class="tk-disc"></div>
        <div class="tk-music-scroll">🎵 Original sound - usai_dramas</div>
      </div>
    </div>
    <div class="tk-progress"><div class="tk-progress-fill"></div></div>
  `;
  
  // Click to play/pause (stops auto-scroll)
  wrap.addEventListener('click', (e) => {
    if (e.target.closest('.tk-action')) return;
    autoScroll = false;
    document.getElementById('autoscroll-ind').style.display = 'none';
    const video = wrap.querySelector('video');
    const ind = wrap.querySelector('.tk-play-ind');
    if (video.paused) {
      video.play();
      ind.textContent = '▶'; ind.classList.remove('show');
    } else {
      video.pause();
      ind.textContent = '⏸'; ind.classList.add('show');
      setTimeout(()=>ind.classList.remove('show'), 800);
    }
  });
  
  feed.appendChild(wrap);
});

// Intersection observer for auto-play
const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    const video = entry.target.querySelector('video');
    const fill = entry.target.querySelector('.tk-progress-fill');
    if (entry.isIntersecting && entry.intersectionRatio > 0.6) {
      // Pause others
      document.querySelectorAll('.tk-video').forEach(v => { if (v !== video) v.pause(); });
      video.play().catch(()=>{});
      currentIdx = [...feed.children].indexOf(entry.target);
      // Update progress
      video.ontimeupdate = () => {
        if (video.duration) fill.style.width = (video.currentTime/video.duration*100)+'%';
      };
      // Auto-scroll to next when video ends (if autoScroll enabled)
      video.onended = () => {
        if (autoScroll && currentIdx < VIDEOS.length - 1) {
          feed.children[currentIdx+1].scrollIntoView({behavior:'smooth'});
        }
      };
    } else {
      video.pause();
    }
  });
}, { threshold: 0.6 });

document.querySelectorAll('.tk-video-wrap').forEach(w => observer.observe(w));

function toggleLike(el) {
  el.classList.toggle('liked');
  const count = el.querySelector('.tk-action-count');
  // Simple visual feedback
}

// Hide autoscroll indicator after 5s
setTimeout(() => {
  const ind = document.getElementById('autoscroll-ind');
  if (ind && autoScroll) ind.style.opacity = '0.5';
}, 5000);
</script>

<!-- Comments Modal -->
<div id="tk-comments" style="display:none;position:fixed;bottom:0;left:0;right:0;max-width:500px;margin:0 auto;background:#1a1a1a;border-radius:20px 20px 0 0;z-index:200;max-height:70vh;flex-direction:column;">
  <div style="padding:16px;border-bottom:1px solid #333;display:flex;justify-content:space-between;align-items:center;">
    <strong>Comments</strong>
    <button onclick="closeComments()" style="background:none;border:none;color:#fff;font-size:1.2rem;cursor:pointer;">✕</button>
  </div>
  <div id="tk-comments-list" style="flex:1;overflow-y:auto;padding:16px;"></div>
  <div style="padding:12px;border-top:1px solid #333;display:flex;gap:8px;">
    <input id="tk-comment-input" placeholder="Add a comment..." style="flex:1;padding:10px;border-radius:20px;border:1px solid #444;background:#2a2a2a;color:#fff;">
    <button onclick="postComment()" style="background:#fe2c55;color:#fff;border:none;border-radius:20px;padding:10px 20px;cursor:pointer;">Post</button>
  </div>
</div>

<script>
let followedUsers = JSON.parse(localStorage.getItem('tk_followed') || '[]');
let likedVideos = JSON.parse(localStorage.getItem('tk_liked') || '[]');

function toggleFollow(el) {
  const username = el.closest('.tk-video-wrap').querySelector('.tk-username').textContent;
  const idx = followedUsers.indexOf(username);
  const btn = el.querySelector('.follow-text');
  if (idx >= 0) {
    followedUsers.splice(idx, 1);
    btn.textContent = 'Follow';
    el.querySelector('div:nth-child(2)').textContent = '+';
  } else {
    followedUsers.push(username);
    btn.textContent = 'Following';
    el.querySelector('div:nth-child(2)').textContent = '✓';
  }
  localStorage.setItem('tk_followed', JSON.stringify(followedUsers));
}

function toggleLike(el) {
  el.classList.toggle('liked');
  const videoWrap = el.closest('.tk-video-wrap');
  const videoSrc = videoWrap.querySelector('video').src;
  const idx = likedVideos.indexOf(videoSrc);
  if (idx >= 0) likedVideos.splice(idx, 1);
  else likedVideos.push(videoSrc);
  localStorage.setItem('tk_liked', JSON.stringify(likedVideos));
}

function openComments(el) {
  const modal = document.getElementById('tk-comments');
  modal.style.display = 'flex';
  const list = document.getElementById('tk-comments-list');
  // Sample comments
  list.innerHTML = `
    <div style="margin-bottom:12px;"><strong>@drama_fan:</strong> 🔥 Amazing scene!</div>
    <div style="margin-bottom:12px;"><strong>@turkish_lover:</strong> Best drama ever! ❤️</div>
    <div style="margin-bottom:12px;"><strong>@usai_user:</strong> Urdu subtitles please! 🙏</div>
  `;
}

function closeComments() {
  document.getElementById('tk-comments').style.display = 'none';
}

function postComment() {
  const input = document.getElementById('tk-comment-input');
  const text = input.value.trim();
  if (!text) return;
  const list = document.getElementById('tk-comments-list');
  const div = document.createElement('div');
  div.style.marginBottom = '12px';
  div.innerHTML = '<strong>@you:</strong> ' + text.replace(/</g,'&lt;');
  list.appendChild(div);
  input.value = '';
  list.scrollTop = list.scrollHeight;
}
</script>

</body>
</html>
