<div class="bd-hero">
  <div class="pic">🎁</div>
  <h1>🎁 Bundles & Deals</h1>
  <p>RDP + proxy combo deals — save 5–7% when you buy together. All USA-first, instant delivery, JazzCash payment. Every bundle is a separate SKU — our base prices never change.</p>
</div>

<div class="bd-grid" id="bd-grid"></div>
<script defer src="ui.js?v=20261013k"></script>
<script src="shop.js?v=20261012b"></script>
<script src="buy-panel.js?v=20261012a"></script>
<script>
(function(){
  "use strict";
  var BUNDLES = [
    { id:"social-media-machine", ic:"🎁", name:"Social Media Machine",
      desc:"RDP 8GB USA + Residential Proxy USA — run automation bots and manage multiple social media accounts from one powerful combo.",
      items:["RDP 8GB RAM (USA)","Residential Proxy (USA)"], worth:3250, price:3050, per:"/mo", savePct:6, billing:"Monthly billing" },
    { id:"residential-3pack", ic:"🎁", name:"Residential 3-Pack",
      desc:"3 × Residential Proxy USA — triple clean residential IPs for agencies and resellers running many accounts. Real home IPs, zero footprints.",
      items:["Residential Proxy (USA) × 3"], worth:7500, price:6990, per:"/mo", savePct:7, billing:"Monthly billing" },
    { id:"trader-starter", ic:"🎁", name:"Trader Starter",
      desc:"RDP 16GB USA + Datacenter Proxy USA — high-performance RDP for trading terminals plus a fast datacenter IP for market data.",
      items:["RDP 16GB RAM (USA)","Datacenter Proxy (USA)"], worth:1900, price:1800, per:"/mo", savePct:5, billing:"Monthly billing" },
    { id:"budget-starter", ic:"💰", name:"Budget Starter",
      desc:"RDP 4GB USA + Datacenter Proxy USA — our cheapest entry combo. Perfect for students and first-time buyers getting started with RDP + proxy.",
      items:["RDP 4GB RAM (USA)","Datacenter Proxy (USA)"], worth:900, price:850, per:"/mo", savePct:6, billing:"Monthly billing" },
    { id:"account-unlock-kit", ic:"🔓", name:"Account Unlock Kit",
      desc:"Residential Proxy USA + WhatsApp OTP Premium Number — everything you need to create new verified social accounts. Clean residential IP + real number in one click.",
      items:["Residential Proxy (USA)","WhatsApp OTP Number (USA)"], worth:3999, price:3750, per:"", savePct:6, billing:"Number one-time · Proxy/monthly" },
    { id:"pro-creator", ic:"🚀", name:"Pro Creator",
      desc:"RDP 16GB USA + HTTP ISP Proxy USA + Residential Proxy USA — the ultimate combo for ecommerce sellers and agencies. Run stores, get fast trusted data, manage social accounts.",
      items:["RDP 16GB RAM (USA)","HTTP ISP Proxy (USA)","Residential Proxy (USA)"], worth:5900, price:5550, per:"/mo", savePct:6, billing:"Monthly billing" },
    { id:"tiktok-shop-seller-kit", ic:"🛍️", name:"TikTok Shop Seller Kit",
      desc:"RDP 8GB USA + Residential Proxy USA + WhatsApp OTP Number — the complete TikTok Shop seller starter: a USA desktop, a clean residential IP and a verified WhatsApp number.",
      items:["RDP 8GB RAM (USA)","Residential Proxy (USA)","WhatsApp OTP Number (USA)"], worth:4749, price:4464, per:"", savePct:6, billing:"Number one-time · RDP/Proxy monthly" },
    { id:"new-account-mini-kit", ic:"🆕", name:"New Account Mini Kit",
      desc:"RDP 4GB USA + Datacenter Proxy USA + Any App OTP Number — the cheapest verified-account starter: a USA desktop, a fast IP and OTP verification for any app.",
      items:["RDP 4GB RAM (USA)","Datacenter Proxy (USA)","Any App OTP Number (USA)"], worth:2199, price:2067, per:"", savePct:6, billing:"Number one-time · RDP/Proxy monthly" },
    { id:"otp-5pack", ic:"📲", name:"Account Farm OTP 5-Pack",
      desc:"5 × Any App OTP Number USA — five OTP verifications in one order for resellers and multi-account setups. Any app, USA numbers.",
      items:["Any App OTP Number (USA) × 5"], worth:6495, price:5846, per:"", savePct:10, billing:"One-time" }
  ];
  function rs(n){ return "$" + (Math.round(n)/280 >= 100 ? Math.round(Math.round(n)/280).toLocaleString("en-US") : (Math.round(n)/280).toFixed(2)); }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
  var grid = document.getElementById("bd-grid"), search = document.getElementById("bd-search"), count = document.getElementById("bd-count");
  function render(q){
    q = (q||"").toLowerCase();
    var shown = 0, html = "";
    BUNDLES.forEach(function(b){
      var hay = (b.name+" "+b.desc+" "+b.items.join(" ")).toLowerCase();
      if(q && hay.indexOf(q)<0) return;
      shown++;
      html += '<div class="bd-card"><div class="top"><div class="ic">'+b.ic+'</div><div><h3>'+esc(b.name)+'</h3><span class="save">Save '+b.savePct+'%</span></div></div>'
        + '<p class="desc">'+esc(b.desc)+'</p><ul class="includes">'
        + b.items.map(function(i){return '<li>✅ '+esc(i)+'</li>';}).join("")
        + '</ul><div class="billing">'+esc(b.billing)+'</div>'
        + '<div class="price-row"><span class="worth">Worth '+rs(b.worth)+'</span><span class="bprice">'+rs(b.price)+b.per+'</span></div>'
        + '<button class="bd-buy" data-bundle="'+b.id+'">🛒 Buy Bundle</button></div>';
    });
    grid.innerHTML = html || '<div class="bd-empty">No bundles match your search.</div>';
    count.textContent = shown + " of " + BUNDLES.length + " bundles";
    grid.querySelectorAll(".bd-buy").forEach(function(btn){
      btn.addEventListener("click", function(){
        var b = BUNDLES.filter(function(x){return x.id===btn.getAttribute("data-bundle");})[0];
        if(b && window.SawalBuyPanel){ window.SawalBuyPanel.open({kind:"BUNDLE", name:b.name, price:b.price, desc:b.desc}); }
        else if(b){ alert(b.name+" — "+rs(b.price)+b.per); }
      });
    });
  }
  search.addEventListener("input", function(){ render(search.value); });
  render("");
})();
</script>
