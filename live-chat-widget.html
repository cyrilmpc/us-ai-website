<!-- Live Chat Widget - injected into pages -->
<div id="lc-widget" style="display:none;position:fixed;bottom:80px;right:20px;width:350px;height:500px;background:#1a1a2e;border:1px solid #8b5cf6;border-radius:16px;z-index:10001;flex-direction:column;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,0.5);">
  <div style="background:linear-gradient(135deg,#8b5cf6,#d946ef);padding:12px;color:white;display:flex;justify-content:space-between;align-items:center;">
    <div><b>💬 Live Chat</b><br><small style="opacity:0.8">US AI Support</small></div>
    <button onclick="document.getElementById('lc-widget').style.display='none'" style="background:none;border:none;color:white;font-size:20px;cursor:pointer;">✕</button>
  </div>
  <div id="lc-login-prompt" style="padding:20px;text-align:center;color:white;">
    <p>Please login to chat with us!</p>
    <button onclick="window.location.href='account.html'" style="background:#8b5cf6;color:white;border:none;padding:10px 20px;border-radius:8px;cursor:pointer;">Login</button>
  </div>
  <div id="lc-chat-area" style="display:none;flex:1;flex-direction:column;">
    <div id="lc-messages" style="flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;"></div>
    <div style="padding:10px;border-top:1px solid #333;display:flex;gap:8px;">
      <input id="lc-input" type="text" placeholder="Type a message..." style="flex:1;padding:8px;border-radius:8px;border:1px solid #444;background:#2a2a3e;color:white;">
      <button onclick="sendChatMessage()" style="background:#8b5cf6;color:white;border:none;padding:8px 16px;border-radius:8px;cursor:pointer;">Send</button>
    </div>
  </div>
</div>
<script>
const CHAT_API = 'https://usai-accounts-api.usai-api.workers.dev';
let chatUserId = null;
let chatPollInterval = null;

function openLiveChat() {
  const widget = document.getElementById('lc-widget');
  widget.style.display = 'flex';
  // Check if logged in (via localStorage or account system)
  const user = JSON.parse(localStorage.getItem('usai_user') || 'null');
  if (user && user.email) {
    chatUserId = user.email;
    document.getElementById('lc-login-prompt').style.display = 'none';
    document.getElementById('lc-chat-area').style.display = 'flex';
    loadMessages();
    startPolling();
  } else {
    document.getElementById('lc-login-prompt').style.display = 'block';
    document.getElementById('lc-chat-area').style.display = 'none';
  }
}

async function loadMessages() {
  if (!chatUserId) return;
  try {
    const res = await fetch(`${CHAT_API}/api/chat/messages?user=${encodeURIComponent(chatUserId)}`);
    const data = await res.json();
    const container = document.getElementById('lc-messages');
    container.innerHTML = '';
    (data.messages || []).forEach(m => {
      const div = document.createElement('div');
      div.style.cssText = m.from === 'owner' 
        ? 'align-self:flex-start;background:#2a2a3e;padding:8px 12px;border-radius:12px;max-width:80%;color:white;'
        : 'align-self:flex-end;background:#8b5cf6;padding:8px 12px;border-radius:12px;max-width:80%;color:white;';
      div.textContent = m.text;
      container.appendChild(div);
    });
    container.scrollTop = container.scrollHeight;
  } catch(e) { console.error('Chat load failed', e); }
}

async function sendChatMessage() {
  const input = document.getElementById('lc-input');
  const text = input.value.trim();
  if (!text || !chatUserId) return;
  input.value = '';
  try {
    await fetch(`${CHAT_API}/api/chat/send`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({user: chatUserId, text: text, from: 'visitor'})
    });
    loadMessages();
  } catch(e) { console.error('Send failed', e); }
}

function startPolling() {
  if (chatPollInterval) clearInterval(chatPollInterval);
  chatPollInterval = setInterval(loadMessages, 3000);
}

// Enter key to send
document.addEventListener('DOMContentLoaded', () => {
  const input = document.getElementById('lc-input');
  if (input) input.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') sendChatMessage();
  });
});
</script>
